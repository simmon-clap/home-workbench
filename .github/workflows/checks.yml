# 离线检查（不连家庭网络/HA，不需要家庭数据）
# 注意：完整门禁（tools/gate.py）依赖真实的 Home Assistant 与家庭数据，只能在自建机器上跑。
name: checks
on:
  push:
  pull_request:
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法编译
        run: python -m compileall -q app tools
      - name: 发布审计（个人标识/凭证/禁止目录）
        run: python tools/release_audit.py --public-set
