# 离线检查（不连家庭网络/HA）：语法 + 纯本地测试 + 凭证扫描
name: checks
on:
  push:
  pull_request:
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法编译
        run: python -m compileall -q app tools
      - name: 纯本地测试（不依赖 HA/家庭数据）
        run: |
          set -e
          for t in tools/test_paths.py tools/test_rules.py tools/test_outbox.py; do
            python "$t"
          done
      - name: 凭证/敏感信息扫描（粗筛）
        run: |
          set -e
          ! grep -rnE 'eyJ[A-Za-z0-9_-]{30,}|PRIVATE KEY|password[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{4,}' \
              --include='*.py' --include='*.md' --include='*.yml' --include='*.html' --include='*.js' \
              app tools docs README.md docker-compose.yml
