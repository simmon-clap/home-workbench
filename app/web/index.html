<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家 · 家庭工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div class="hd">
    <div class="hi" id="greet"></div>
    <div class="meta">
      <div id="env"></div>
      <div class="num" id="fTime"></div>
    </div>
  </div>

  <div class="stalebar" id="staleBar" hidden></div>
  <div class="remind" id="remind">
    <span class="tx" id="remindTx"></span>
    <span class="go" id="remindGo"></span>
  </div>

  <div class="wrap">
    <div class="stage"><svg id="house" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="mlist" id="mlist"></div>
    <div class="panel hidden" id="roomPanel"></div>
  </div>

  <div class="ft">
    <span class="num" id="tTotal"></span><span class="sep"></span>
    <span class="num" id="tOff"></span><span class="sep"></span>
    <span class="num" id="tUnknown"></span><span class="sep"></span>
    <span class="num" id="tSec"></span>
    <a id="goHome"></a>
    <a id="go3d" href="/space/scan-room-model.html">3D 客餐厅</a>
  </div>
</div>
<script src="/settings.js"></script>
<script src="/app.js"></script>

<script>
/* P6 多端：离线壳（只在安全上下文注册：tailnet https / 本机 localhost）
   断网时给一个诚实的“连不上”页，不回放任何旧数据。 */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
